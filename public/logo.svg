<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#0a1218"/>
      <stop offset="65%" stop-color="#04070a"/>
      <stop offset="100%" stop-color="#010305"/>
    </radialGradient>

    <!-- Outer Teal Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14f1d9"/>
      <stop offset="30%" stop-color="#00c8b3"/>
      <stop offset="60%" stop-color="#006d64"/>
      <stop offset="85%" stop-color="#00a896"/>
      <stop offset="100%" stop-color="#14f1d9"/>
    </linearGradient>

    <!-- Metallic Teal Surface Gradient -->
    <linearGradient id="tealMetallic" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#46fff2"/>
      <stop offset="25%" stop-color="#05dfcc"/>
      <stop offset="50%" stop-color="#00998c"/>
      <stop offset="75%" stop-color="#02d4c2"/>
      <stop offset="100%" stop-color="#00756c"/>
    </linearGradient>

    <!-- Bevel Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#26ffe6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#003e38" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Inner Shadow Filter -->
    <filter id="embossDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Outer Protective Circular Frame -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="16" filter="url(#embossDepth)"/>
  <circle cx="250" cy="250" r="226" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="#00ffe1" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Concentric Upper Crescent Arc -->
  <path d="M 160 375 A 175 175 0 1 1 350 120 A 185 185 0 0 0 135 340 Z" fill="url(#tealMetallic)" filter="url(#embossDepth)"/>

  <!-- Medical Cross (+) at top right -->
  <g filter="url(#tealGlow)">
    <path d="M 374 148 L 374 168 L 354 168 L 354 182 L 374 182 L 374 202 L 388 202 L 388 182 L 408 182 L 408 168 L 388 168 L 388 148 Z" 
          fill="url(#tealMetallic)" stroke="#67fffa" stroke-width="1.5" filter="url(#embossDepth)"/>
  </g>

  <!-- Central Stylized "E" Glyph -->
  <!-- Top Arm with Serifs -->
  <path d="M 198 152 
           C 210 148 245 146 345 146 
           L 345 190 
           L 326 190 
           C 318 174 300 168 280 168 
           L 256 168 
           L 256 226 
           L 310 226 
           C 328 226 332 238 332 250 
           C 332 262 328 274 310 274 
           L 256 274 
           L 256 312 
           C 278 312 308 304 330 286 
           L 345 322 
           C 310 338 270 340 226 340 
           C 185 340 180 320 180 290 
           L 180 188 
           C 180 162 188 155 198 152 Z" 
        fill="url(#tealMetallic)" stroke="#7afff7" stroke-width="1.5" filter="url(#embossDepth)"/>

  <!-- Subtle Specular Sheen across E stem -->
  <path d="M 226 156 L 256 156 L 256 330 L 226 330 Z" fill="url(#highlightGrad)" opacity="0.3"/>

  <!-- Three Foliage Leaves Rising from Bottom-Left -->
  <!-- Left Outer Leaf -->
  <path d="M 172 376 
           C 140 330 120 250 134 208 
           C 152 232 176 275 174 340 Z" 
        fill="url(#tealMetallic)" stroke="#5afff3" stroke-width="1.2" filter="url(#embossDepth)"/>

  <!-- Middle Leaf -->
  <path d="M 184 355 
           C 162 305 160 255 186 218 
           C 198 250 206 295 192 345 Z" 
        fill="url(#tealMetallic)" stroke="#5afff3" stroke-width="1.2" filter="url(#embossDepth)"/>

  <!-- Right Inner Leaf flowing into base of E -->
  <path d="M 198 348 
           C 192 285 220 230 262 215 
           C 264 260 230 310 198 348 Z" 
        fill="url(#tealMetallic)" stroke="#85fffa" stroke-width="1.2" filter="url(#embossDepth)"/>

  <!-- Protective Cradling Hand at Bottom -->
  <path d="M 166 385 
           C 185 410 240 415 270 412 
           C 310 408 360 385 390 320 
           C 405 348 370 415 305 432 
           C 240 448 180 432 152 398 
           C 148 392 158 376 166 385 Z" 
        fill="url(#tealMetallic)" stroke="#67fffa" stroke-width="1.5" filter="url(#embossDepth)"/>

  <!-- Inner Palm / Fingers contour -->
  <path d="M 176 388 
           C 220 370 290 366 332 344 
           C 336 348 334 358 318 362 
           C 275 375 230 385 188 402 Z" 
        fill="#00524b" opacity="0.8"/>
  <path d="M 270 370 
           C 300 368 334 350 338 344 
           C 330 360 305 376 270 378 Z" 
        fill="url(#tealMetallic)"/>
</svg>
